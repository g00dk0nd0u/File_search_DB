<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; frame-src blob:; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Folder Search</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="search.js"></script>
    <script defer src="filesystem.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main>
      <section id="search-view" aria-label="Folder Search">
        <form id="search-form" class="toolbar">
          <select id="root" aria-label="Search Target" disabled></select>
          <div class="query-group">
            <input
              id="query"
              placeholder="Enter keyword"
              aria-label="Keyword"
              autocomplete="off"
            /><button id="search" type="submit" disabled>Search</button>
          </div>
          <button id="settings-button" class="secondary" type="button">
            Settings
          </button>

<div class="filters">
  <label for="modified">更新日</label><select id="modified" aria-label="更新日"><option value="all">すべての期間</option>
    <option value="7">過去7日以内</option>
    <option value="14">過去14日以内</option>
    <option value="30">過去30日以内</option>
    <option value="60">過去60日以内</option>
    <option value="180">過去180日以内</option></select>
  <label for="format">ファイル形式</label><select id="format" aria-label="ファイル形式"><option value="all">すべての形式</option>
    <option value="pdf">PDF</option>
    <option value="jpg">JPG</option>
    <option value="png">PNG</option>
    <option value="excel">Excel</option>
    <option value="powerpoint">PowerPoint</option>
    <option value="word">Word</option>
    <option value="txt">TXT</option>
    <option value="dwg">DWG</option>
    <option value="revit">Revit</option>
    <option value="sketchup">SketchUp</option>
    <option value="grasshopper">Grasshopper</option></select>
</div>
</form>
        <p id="meta" class="meta" aria-live="polite"></p>
        <div id="workspace" class="workspace">
          <aside id="preview-panel" hidden class="preview-panel" aria-label="Preview"><button id="preview-close" type="button" class="secondary preview-close" aria-label="プレビューを閉じる">×</button>
            <h1>Preview</h1>
            <div id="preview" class="preview" aria-live="polite"></div>
          </aside>
          <div id="results" role="region" aria-label="Search results"></div>
        </div>
      </section>
      <section id="settings-view" aria-label="Folder Manager" hidden>
        <div class="toolbar">
          <button id="add" disabled>Add Directory</button
          ><button class="secondary theme" aria-label="Dark Mode" aria-pressed="false">Dark Mode</button
          ><button id="back" class="secondary">Back to Search</button>
        </div>
        <p class="hint">
          Only the selected folders are read. Delete removes registration and
          index; your files stay in place.
        </p>
        <div class="table-scroll">
          <table class="settings-table">
            <thead>
              <tr>
                <th>Display Name</th>
                <th>Path (relative)</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="roots"></tbody>
          </table>
        </div>
        <p id="storage-info" class="hint"></p>
      </section>
      <div id="notice" role="status" hidden></div>
      <div id="progress-wrap" hidden>
        <span id="progress" role="status"></span
        ><button id="cancel" class="secondary">Cancel scan</button>
      </div>
      <p id="support" class="hint">Checking browser and local storage…</p>
      <noscript>Enable JavaScript to use Folder Search.</noscript>
    </main>
  </body>
</html>
