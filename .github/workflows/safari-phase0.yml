name: Safari Phase 0 file probe

on:
  pull_request:
    branches: [main3]
    paths:
      - "safari/**"
      - ".github/workflows/safari-phase0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari-phase0:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory
        run: |
          mkdir -p "$RUNNER_TEMP/safari-phase0"
          echo "SAFARI_ARTIFACTS=$RUNNER_TEMP/safari-phase0" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PoC synthetic regression tests (native Node decoder)
        run: node safari/poc-tests.cjs 2>&1 | tee "$SAFARI_ARTIFACTS/poc-tests.log"
      - name: Python syntax and existing regression tests
        run: |
          python3 -m py_compile safari/check_safari.py
          python3 -m unittest discover -s tests -v 2>&1 | tee "$SAFARI_ARTIFACTS/python-regression.log"
      - name: Enable Apple WebDriver on disposable CI runner
        run: sudo /usr/bin/safaridriver --enable 2>&1 | tee "$SAFARI_ARTIFACTS/webdriver-enable.log"
      - name: Installed Safari direct file URL and restart probe
        run: python3 safari/check_safari.py 2>&1 | tee "$SAFARI_ARTIFACTS/probe.log"
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-phase0-${{ github.run_attempt }}
          path: ${{ env.SAFARI_ARTIFACTS }}
          if-no-files-found: warn
          retention-days: 14
