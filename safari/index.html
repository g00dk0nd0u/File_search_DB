<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; frame-src blob:; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Folder Search — Safari</title>
<link rel="stylesheet" href="styles.css">
<script defer src="search.js"></script>
<script defer src="core.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main>
<section id="search-view" aria-label="Folder Search">
<form id="search-form" class="toolbar">
<label for="root">Search Target</label><select id="root" disabled></select>
<div class="query-group"><input id="query" aria-label="検索キーワード" placeholder="Enter keyword" autocomplete="off"><button id="search" disabled>Search</button></div>
<button id="reselect" type="button" class="secondary" disabled>フォルダ再選択</button>
<button id="settings-button" type="button" class="secondary" disabled>Settings</button>
</form>
<p class="hint">AND: 空白 · OR · -除外 · "フレーズ" — ファイル名・フォルダ名を検索</p>
<p id="meta" role="status">登録情報を読み込んでいます…</p>
<div class="workspace"><div id="results" aria-label="検索結果"></div><aside aria-label="プレビュー"><h2 id="preview-title">Preview</h2><div id="preview"><p class="hint">ファイルを選択してください。</p></div></aside></div>
</section>
<section id="settings-view" aria-label="Folder Manager" hidden>
<div class="toolbar"><h1>Settings</h1><button id="add" disabled>Add Directory</button><button id="back" class="secondary">Back to Search</button></div>
<p class="hint">登録先への再選択は、選んだフォルダでその登録を置き換えます。同名でも同じ実体とは確認できません。登録削除で実ファイルは削除されません。</p>
<div class="table-scroll"><table><thead><tr><th>Display Name</th><th>選択フォルダ名（絶対パス取得不可）</th><th>Status</th><th>Actions</th></tr></thead><tbody id="roots"></tbody></table></div>
</section>
<p id="notice" role="status" hidden></p>
<p class="hint footer">Safariを再起動・ページを再読込した後は、対象フォルダを再選択してください。追加・削除の反映も再選択が必要です。空フォルダの完全列挙はできません。</p>
<input id="picker" type="file" webkitdirectory multiple hidden aria-label="検索対象フォルダ">
<noscript>JavaScriptを有効にして、このHTMLをSafariで開いてください。</noscript>
</main>
</body>
</html>
