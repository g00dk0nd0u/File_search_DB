<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob:; frame-src blob:; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Folder Search — Safari</title>
<link rel="stylesheet" href="styles.css">
<script defer src="search.js"></script>
<script defer src="core.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main>
<section id="search-view" aria-label="Folder Search">
<form id="search-form" class="toolbar">
<select id="root" aria-label="検索対象ルート" disabled></select>
<div class="query-group"><input id="query" aria-label="検索キーワード" placeholder="Enter keyword" autocomplete="off"><button id="search" disabled>Search</button></div>
<button id="settings-button" type="button" class="secondary" disabled>Settings</button>

<div class="filters">
  <label for="modified">更新日</label><select id="modified" aria-label="更新日"><option value="all">すべての期間</option>
    <option value="7">過去7日以内</option>
    <option value="14">過去14日以内</option>
    <option value="30">過去30日以内</option>
    <option value="60">過去60日以内</option>
    <option value="180">過去180日以内</option></select>
  <label for="format">ファイル形式</label><select id="format" aria-label="ファイル形式"><option value="all">すべての形式</option>
    <option value="pdf">PDF</option>
    <option value="jpg">JPG</option>
    <option value="png">PNG</option>
    <option value="excel">Excel</option>
    <option value="powerpoint">PowerPoint</option>
    <option value="word">Word</option>
    <option value="txt">TXT</option>
    <option value="dwg">DWG</option>
    <option value="revit">Revit</option>
    <option value="sketchup">SketchUp</option>
    <option value="grasshopper">Grasshopper</option></select>
</div>
</form>
<p id="meta" role="status">登録情報を読み込んでいます…</p>
<div id="workspace" class="workspace"><aside id="preview-panel" hidden aria-label="プレビュー"><button id="preview-close" type="button" class="secondary preview-close" aria-label="プレビューを閉じる">×</button><h2 id="preview-title">Preview</h2><div id="preview"><p class="hint">ファイルを選択してください。</p></div></aside><div id="result-column"><div id="results" role="region" aria-label="検索結果"></div><div id="result-controls" class="result-controls" hidden><span>表示済み / 総件数: <span id="result-count" role="status" aria-live="polite"></span></span><button id="result-more" type="button" class="secondary">さらに100件表示</button></div></div></div>
</section>
<section id="settings-view" aria-label="Folder Manager" hidden>
<div class="toolbar"><h1>Settings</h1><button id="add" disabled>Add Directory</button><button id="back" class="secondary">Back to Search</button></div>
<p class="theme-setting"><button id="theme-toggle" type="button" class="secondary" aria-pressed="false">Dark Mode</button> <span id="theme-status" role="status">Light</span></p>
<p class="hint">登録先への再選択は、選んだフォルダでその登録を置き換えます。同名でも同じ実体とは確認できません。登録削除で実ファイルは削除されません。</p>
<div class="table-scroll"><table><thead><tr><th>Display Name</th><th>選択フォルダ名（絶対パス取得不可）</th><th>Status</th><th>Actions</th></tr></thead><tbody id="roots"></tbody></table></div>
</section>
<p id="notice" role="status" hidden></p>
<input id="picker" type="file" webkitdirectory multiple hidden aria-label="検索対象フォルダ">
<noscript>JavaScriptを有効にして、このHTMLをSafariで開いてください。</noscript>
</main>
</body>
</html>
